server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache because Vite fingerprints filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — every non-file request falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
